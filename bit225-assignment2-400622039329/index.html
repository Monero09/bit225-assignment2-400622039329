<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLib Catalogue</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>BlueLib Catalogue</h1>
            <p>BlueCrest College Library Portal</p>
        </div>
    </header>
    
    <nav>
        <div class="nav-container">
            <input type="text" id="searchInput" placeholder="Search by title...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Cyber Security">Cyber Security</option>
                <option value="Business Administration">Business Administration</option>
                <option value="Fashion Design">Fashion Design</option>
                <option value="Mass Communication">Mass Communication</option>
            </select>
        </div>
    </nav>
    
    <main>
        <section class="add-book-section">
            <h2>Add New Book</h2>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <form id="addBookForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Cyber Security">Cyber Security</option>
                        <option value="Business Administration">Business Administration</option>
                        <option value="Fashion Design">Fashion Design</option>
                        <option value="Mass Communication">Mass Communication</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="copies">Copies Available</label>
                    <input type="number" id="copies" name="copies" min="0" required>
                </div>
                <button type="submit" class="btn-primary">Add Book</button>
            </form>
        </section>
        
        <section class="book-list-section">
            <h2>Catalogue</h2>
            <div id="bookContainer" class="book-container">
                <!-- Book cards will be rendered here dynamically by app.js -->
            </div>
        </section>
    </main>
    
    <footer>
        <p>© 2024 BlueCrest College Library | Lesly Ambe - Roll Number: 400622039329</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
